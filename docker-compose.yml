services:
  api:
    build: 
      context: ./services/api
      dockerfile: ../../docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./services/api:/app
      - ./services/snippet-engine:/snippet-engine
      - ./services/stats-engine:/stats-engine
    depends_on:
      - web

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

networks:
  default:
    driver: bridge